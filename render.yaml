services:
  - type: web
    name: ai-company-evaluation-pipeline
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install ".[web]"
    startCommand: uvicorn ai_company_eval.web:app --host 0.0.0.0 --port $PORT --log-level warning --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_MODE
        value: portfolio
      - key: ALLOW_LIVE_FETCH
        value: "false"
      - key: ALLOW_LIVE_PROVIDERS
        value: "false"
