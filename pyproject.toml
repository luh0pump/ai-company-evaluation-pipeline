[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-evaluation-pipeline"
version = "0.1.0"
description = "Production-minded Python pipeline for reusable website extraction and structured LLM evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.115,<1", "jinja2>=3.1,<4", "uvicorn>=0.30,<1"]

[project.scripts]
company-eval = "ai_company_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_company_eval = ["web_assets/templates/*.html", "web_assets/static/*.css", "web_assets/static/*.js", "web_assets/fixtures/*.json", "web_assets/fixtures/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
